\<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h2>🏫 Control de Asistencia</h2>
    </header>

    <div class="container container-single">
        <div class="panel">
            <div class="control-group">
                <label for="cursoSelect"><strong>Curso:</strong></label>
                <select id="cursoSelect">
                    <!-- Se llena desde Python -->
                </select>
            </div>

            <div class="video-container">
                <video id="webcam" autoplay playsinline muted></video>
            </div>

            <div id="status" class="status-box">Inicializando sistema de video...</div>
            <div id="diagnostico" class="diag-box"></div>

            <!-- Confirmación manual: aparece cuando la cámara detecta un candidato -->
            <div id="confirmacion" class="confirm-box" style="display:none;">
                <div class="confirm-texto">
                    ¿Sos <strong id="confirmNombre"></strong>, del curso <strong id="confirmCurso"></strong>?
                </div>
                <div class="confirm-botones">
                    <button class="btn-success" onclick="confirmarAsistencia()">✅ Sí, soy yo</button>
                    <button class="btn-danger" onclick="rechazarAsistencia()">❌ No soy yo</button>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
